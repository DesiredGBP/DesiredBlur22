name: Build Desired Blur for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download ImGui and stb
        shell: pwsh
        run: |
          Remove-Item "dependencies/imgui" `
            -Recurse -Force -ErrorAction SilentlyContinue

          Remove-Item "dependencies/stb" `
            -Recurse -Force -ErrorAction SilentlyContinue

          git clone --depth 1 `
            https://github.com/ocornut/imgui.git `
            dependencies/imgui

          git clone --depth 1 `
            https://github.com/nothings/stb.git `
            dependencies/stb

      - name: Enable Visual Studio
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Windows build tools
        shell: pwsh
        run: |
          choco install ccache innosetup ninja `
            --yes `
            --no-progress

      - name: Configure ccache
        shell: pwsh
        run: |
          ccache --set-config=max_size=500M
          ccache --set-config=compression=true
          ccache --zero-stats

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: ~/AppData/Local/ccache
          key: ccache-windows-x64-release-${{ github.sha }}
          restore-keys: |
            ccache-windows-x64-release-

      - name: Cache runtime dependencies
        uses: actions/cache@v5
        with:
          path: ci/out
          key: runtime-deps-windows-${{ hashFiles('ci/build-dependencies-windows.ps1') }}

      - name: Collect runtime dependencies
        shell: pwsh
        run: |
          Set-Location ci
          ./build-dependencies-windows.ps1

      - name: Set up vcpkg
        shell: pwsh
        run: |
          Remove-Item "$env:GITHUB_WORKSPACE/vcpkg" `
            -Recurse -Force -ErrorAction SilentlyContinue

          git clone --depth 1 `
            https://github.com/microsoft/vcpkg.git `
            "$env:GITHUB_WORKSPACE/vcpkg"

          & "$env:GITHUB_WORKSPACE/vcpkg/bootstrap-vcpkg.bat" `
            -disableMetrics

      - name: Get vcpkg commit
        id: vcpkg-commit
        shell: pwsh
        run: |
          $hash = git -C vcpkg rev-parse HEAD
          "hash=$hash" >> $env:GITHUB_OUTPUT

      - name: Cache dynamic vcpkg packages
        uses: actions/cache@v5
        with:
          path: |
            vcpkg_installed
            vcpkg/downloads
            vcpkg/packages
          key: vcpkg-dynamic-windows-x64-release-${{ steps.vcpkg-commit.outputs.hash }}-${{ hashFiles('vcpkg.json', 'CMakePresets.json', 'CMakeLists.txt') }}
          restore-keys: |
            vcpkg-dynamic-windows-x64-release-${{ steps.vcpkg-commit.outputs.hash }}-
            vcpkg-dynamic-windows-x64-release-

      - name: Clean old CMake files
        shell: pwsh
        run: |
          Remove-Item "CMakeCache.txt" `
            -Force -ErrorAction SilentlyContinue

          Remove-Item "CMakeFiles" `
            -Recurse -Force -ErrorAction SilentlyContinue

          Remove-Item "build" `
            -Recurse -Force -ErrorAction SilentlyContinue

          Remove-Item "bin" `
            -Recurse -Force -ErrorAction SilentlyContinue

      - name: Configure CMake
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          VCPKG_DEFAULT_TRIPLET: x64-windows
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          cmake --preset win-release `
            -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build Desired Blur
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          VCPKG_DEFAULT_TRIPLET: x64-windows
        run: |
          cmake --build . --parallel

      - name: Print ccache statistics
        shell: pwsh
        run: ccache --show-stats

      - name: List generated executables
        shell: pwsh
        run: |
          Get-ChildItem `
            -Path . `
            -Recurse `
            -Filter "*.exe" |
          Select-Object -ExpandProperty FullName

      - name: Prepare portable package
        shell: pwsh
        run: |
          $artifactRoot = "artifacts"
          $portable = "$artifactRoot/Desired-Blur-Portable"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $portable |
          Out-Null

          $gui = Get-ChildItem `
            -Path "bin" `
            -Recurse `
            -File |
          Where-Object {
            $_.Name -in @(
              "Desired Blur.exe",
              "blur-gui.exe",
              "blur.exe"
            )
          } |
          Select-Object -First 1

          $cli = Get-ChildItem `
            -Path "bin" `
            -Recurse `
            -File |
          Where-Object {
            $_.Name -in @(
              "Desired Blur CLI.exe",
              "blur-cli.exe"
            )
          } |
          Select-Object -First 1

          if (-not $gui) {
            throw "The GUI executable was not found."
          }

          Copy-Item `
            $gui.FullName `
            (Join-Path $portable "Desired Blur.exe") `
            -Force

          if ($cli) {
            Copy-Item `
              $cli.FullName `
              (Join-Path $portable "Desired Blur CLI.exe") `
              -Force
          } else {
            Write-Warning "The CLI executable was not found."
          }

          if (Test-Path "bin/Release/lib") {
            Copy-Item `
              "bin/Release/lib" `
              $portable `
              -Recurse `
              -Force
          }

          if (Test-Path "ci/out") {
            Copy-Item `
              "ci/out/*" `
              $portable `
              -Recurse `
              -Force
          }

          if (Test-Path "README.md") {
            Copy-Item "README.md" $portable
          }

          if (Test-Path "LICENSE") {
            Copy-Item "LICENSE" $portable
          }

          Compress-Archive `
            -Path "$portable/*" `
            -DestinationPath `
              "$artifactRoot/Desired-Blur-Windows-x64-Portable.zip" `
            -Force

      - name: Prepare installer
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path "installer/resources" |
          Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "installer/dependencies/lib" |
          Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "installer/redist" |
          Out-Null

          $gui = Get-ChildItem `
            -Path "bin" `
            -Recurse `
            -Filter "blur-gui.exe" |
          Select-Object -First 1

          $cli = Get-ChildItem `
            -Path "bin" `
            -Recurse `
            -Filter "blur-cli.exe" |
          Select-Object -First 1

          if (-not $gui) {
            throw "blur-gui.exe was not found for the installer."
          }

          Copy-Item `
            $gui.FullName `
            "installer/resources/blur-gui.exe" `
            -Force

          if ($cli) {
            Copy-Item `
              $cli.FullName `
              "installer/resources/blur-cli.exe" `
              -Force
          }

          if (Test-Path "ci/out") {
            Copy-Item `
              "ci/out/*" `
              "installer/dependencies/lib" `
              -Recurse `
              -Force
          }

          Invoke-WebRequest `
            -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" `
            -OutFile "installer/redist/VC_redist.x64.exe"

          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "installer/setup.iss"

          $installer = Get-ChildItem `
            -Path "installer/output" `
            -Filter "*.exe" |
          Select-Object -First 1

          if ($installer) {
            Copy-Item `
              $installer.FullName `
              "artifacts/Desired-Blur-Windows-x64-Installer.exe" `
              -Force
          } else {
            Write-Warning "The installer was not generated."
          }

      - name: Upload Windows build
        uses: actions/upload-artifact@v6
        with:
          name: Desired-Blur-Windows-x64
          path: |
            artifacts/Desired-Blur-Windows-x64-Portable.zip
            artifacts/Desired-Blur-Windows-x64-Installer.exe
          if-no-files-found: error
          retention-days: 30
